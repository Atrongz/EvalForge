name: fix-add
description: >
  A minimal SWE-bench-shaped environment: a repository seeded in a broken state,
  the repository's own test as the reward, and the grader pinned so rewriting it
  scores zero. Demonstrates the full contract — reset, action space, terminal
  verification, and a reward-hack gate that has to be satisfied before the task
  counts for anything.

env: file_task
env_config:
  allow_commands: true
  command_timeout: 30

pass_threshold: 1.0
max_parallel: 4
