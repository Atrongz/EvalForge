name: hackable-demo
description: >
  A deliberately unsound suite. Every task here is broken in a way the gate is
  built to catch, so `evalforge gate hackable-demo` is EXPECTED to exit 1.
  It exists so the gate can be seen working rather than taken on trust — a gate
  nobody has watched fail is a gate nobody should rely on.

env: file_task
env_config:
  allow_commands: true

pass_threshold: 1.0
max_parallel: 4
