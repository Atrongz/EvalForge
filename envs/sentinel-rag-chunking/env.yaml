name: sentinel-rag-chunking
description: >
  A real repository as an environment. Extracts sentinel-rag at a git ref into a
  disposable sandbox, provisions an interpreter with the dependency closure of the
  target test, and lets the repository's own tests decide the reward. The grader is
  hash-pinned, so rewriting or deleting the test scores zero.

  The broken state here is synthesized rather than mined -- scripts/mine_tasks.py
  reports 0 usable candidates for this repo. That is a property of the asset, not of
  the pipeline: everything after the starting state is identical either way.

env: repo
env_config:
  # Per-task `setup.repo` wins; this is the default for the suite.
  repo: C:\Users\atron\Personal Proj\sentinel-rag
  ref: HEAD
  # src/ layout: the source tree joins the cached venv through PYTHONPATH, so the
  # venv holds no repo code and stays reusable across episodes.
  python_path: [src]
  command_timeout: 180

pass_threshold: 1.0
max_parallel: 1
